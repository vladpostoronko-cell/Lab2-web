<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирование авиабилета — AirShop</title>
  <meta name="description" content="Заполните форму для бронирования авиабилета. Безопасная оплата и мгновенное подтверждение.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">✈ AirShop</a>
      <nav>
        <ul class="nav-list">
          <li><a href="index.html">Главная</a></li>
          <li><a href="catalog.html">Авиабилеты</a></li>
          <li><a href="booking.html" class="active">Бронирование</a></li>
          <li><a href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="booking-section">
      <div class="container">
        <form class="booking-form" id="bookingForm" novalidate>
          <h2>Оформление билета</h2>
          
          <div class="form-group">
            <label for="name">ФИО пассажира</label>
            <input type="text" id="name" placeholder="Иванов Иван Иванович" required minlength="5">
            <span class="error-msg" id="nameError"></span>
          </div>
          
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@mail.ru" required>
            <span class="error-msg" id="emailError"></span>
          </div>
          
          <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" placeholder="+7 (999) 123-45-67" required>
            <span class="error-msg" id="phoneError"></span>
          </div>
          
          <div class="form-group">
            <label for="passport">Серия и номер паспорта</label>
            <input type="text" id="passport" placeholder="1234 567890" required minlength="10">
            <span class="error-msg" id="passportError"></span>
          </div>
          
          <button type="submit" class="btn-primary">Забронировать</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 AirShop. Все права защищены.</p>
    </div>
  </footer>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      let valid = true;
      
      const name = document.getElementById('name');
      const email = document.getElementById('email');
      const phone = document.getElementById('phone');
      const passport = document.getElementById('passport');
      
      // Сброс ошибок
      ['name', 'email', 'phone', 'passport'].forEach(id => {
        document.getElementById(id + 'Error').textContent = '';
      });
      
      // Проверки
      if (name.value.trim().length < 5) {
        document.getElementById('nameError').textContent = 'Введите полное ФИО';
        valid = false;
      }
      if (!email.value.includes('@') || !email.value.includes('.')) {
        document.getElementById('emailError').textContent = 'Введите корректный Email';
        valid = false;
      }
      if (phone.value.trim().length < 10) {
        document.getElementById('phoneError').textContent = 'Введите номер телефона';
        valid = false;
      }
      if (passport.value.trim().length < 10) {
        document.getElementById('passportError').textContent = 'Введите серию и номер паспорта';
        valid = false;
      }
      
      if (valid) {
        alert('Билет успешно забронирован!');
        this.reset();
      }
    });
  </script>
</body>
</html>
